name: release

on:
  push:
    tags: ['v*']
  # 打真的 tag 之前先試跑一次。打包這一段(stage 佈局 → makeappx pack → bundle)
  # 在 tag 出現之前沒有任何機會被執行過,而它壞掉的代價是「tag 已經推上去了,
  # 重跑還得先把 tag 刪掉」。dispatch 跑完整條路,只跳過最後建 Release 那一步。
  workflow_dispatch:
    inputs:
      dry_run_version:
        description: '試跑用的版本號(v<major>.<minor>.<patch> 的數字部分)'
        required: false
        default: '0.0.0'

# 預設唯讀,寫入權限只給真的要建 Release 的那個 job —— build job 會跑
# dotnet publish 與 makeappx,不需要能改這個 repo。
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform 的大小寫要跟 Inkling.csproj 的 <Platforms>x64;ARM64</Platforms> 一致。
          - { arch: x64, platform: x64, profile: win-x64 }
          - { arch: arm64, platform: ARM64, profile: win-arm64 }
    env:
      # 簽章佔位:走自購 OV 憑證路線時,把 PFX 以 base64 存進 repo secret
      # SIGNING_CERT_BASE64、密碼存進 SIGNING_CERT_PASSWORD,下面的簽章步驟就會啟用。
      # 走 Store 代簽路線則不需要 —— 直接拿這裡產出的未簽章 bundle 上傳 Partner Center。
      #
      # 這裡**只放一個布林旗標,不放憑證本身**:job 層的 env 每一個步驟都讀得到,
      # 包含 dotnet publish 與 makeappx —— 那些步驟會跑到第三方的 MSBuild 目標與
      # 還原下來的套件,沒有理由讓它們看得到私鑰。憑證只掛在真的要簽的那一步。
      # 旗標非用 job 層 env 不可:GitHub 明講 `secrets` 在步驟的 `if:` 裡讀不到,
      # 官方給的解法就是先映射成 job 層的 env 再比對。
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          # workflow_dispatch 時 github.ref_name 是分支名,不是 tag —— 改用輸入的版本。
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.dry_run_version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本必須是 <major>.<minor>.<patch>,實際是 '$tag'"
          }
          # MSIX 版本是四段,而且第四段必須是 0(Store 的規定)。
          "appx_version=$tag.0" >> $env:GITHUB_OUTPUT
          # 資產檔名用得到:tag 那條路是 v0.2.0,dispatch 那條路是 v0.0.0。
          "tag_name=v$tag" >> $env:GITHUB_OUTPUT

      - name: Inject version into Package.appxmanifest
        shell: pwsh
        run: |
          # -p:AppxPackageVersion 對這套單專案 MSIX 目標沒有作用(本機實測:產生的
          # AppxManifest.xml 仍是 manifest 裡的 0.1.0.0),所以直接改 manifest 的
          # Version 屬性。身分欄位(Name / Publisher)不碰 —— 見 docs/release-checklist.md。
          # 這個改動只發生在 CI 的 checkout 上,不會 commit 回去。
          $path = 'src/Inkling/Package.appxmanifest'
          [xml]$m = Get-Content $path
          $m.Package.Identity.Version = '${{ steps.ver.outputs.appx_version }}'
          $m.Save((Resolve-Path $path).Path)

      # tag 可能打在沒跑過 ci.yml 的 commit 上(或 ci 之後又推了東西),
      # 所以發版這條路自己再驗一次 —— Core 的測試三秒跑完,比事後撤回一個版本便宜。
      - name: Test
        run: dotnet test --nologo

      - name: Publish (Release, trimmed)
        run: dotnet publish src/Inkling/Inkling.csproj -c Release -p:Platform=${{ matrix.platform }} -p:PublishProfile=${{ matrix.profile }}

      - name: Stage package layout
        shell: pwsh
        run: |
          # 佈局邏輯與 tools/deploy.ps1 共用同一支腳本 —— 以前兩邊各寫一份,
          # 而這條路在打 tag 之前不會被執行,漂掉了也沒人會發現。
          $tfm = 'net10.0-windows10.0.26100.0'
          ./tools/stage-layout.ps1 `
            -PublishDir "src/Inkling/bin/Release/$tfm/win-${{ matrix.arch }}/publish" `
            -BuildLayoutDir "src/Inkling/bin/${{ matrix.platform }}/Release/$tfm/win-${{ matrix.arch }}" `
            -StageDir "artifacts/stage-${{ matrix.arch }}"

      - name: Pack .msix
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw '在 Windows Kits 底下找不到 makeappx.exe' }
          New-Item -ItemType Directory -Force -Path artifacts/out | Out-Null
          # 不加 /nv:讓 makeappx 做完整的套件驗證,清單或資產有問題在這裡就擋下。
          & $makeappx pack /o `
            /d "artifacts/stage-${{ matrix.arch }}" `
            /p "artifacts/out/Inkling_${{ steps.ver.outputs.appx_version }}_win-${{ matrix.arch }}.msix"
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack 失敗($LASTEXITCODE)" }

      - name: Sign .msix
        # 需要憑證:目前還沒有公開信任的程式碼簽章憑證(決策見 docs/release-checklist.md)。
        # 未設定 secret 時這一步整個跳過,產出的是未簽章套件 —— 只能拿去 Store 送審
        # (Store 會代簽),不能給一般使用者側載(Windows 會以 0x800B0109 擋下)。
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        # 憑證只在這一步存在,不放 job 層 —— job 層的 env 連 dotnet publish 都讀得到。
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = New-TemporaryFile
          try {
            [IO.File]::WriteAllBytes($pfx.FullName, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx.FullName /p $env:SIGNING_CERT_PASSWORD `
              "artifacts/out/Inkling_${{ steps.ver.outputs.appx_version }}_win-${{ matrix.arch }}.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool sign 失敗($LASTEXITCODE)" }
          }
          finally {
            Remove-Item $pfx.FullName -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: artifacts/out/*.msix
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 與 build job 同一組 secret:bundle 也要簽,否則 Release 上掛的是
      # 「裡面每個 .msix 都簽好、外面那層沒簽」的東西,側載照樣被 Windows 擋下。
      # 同樣只放旗標,憑證掛在簽章那一步自己的 env。
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          path: artifacts/msix
          merge-multiple: true

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          # 格式已經在 build job 驗過(這個 job needs: build),這裡只還原同一個值。
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.dry_run_version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          "appx_version=$tag.0" >> $env:GITHUB_OUTPUT
          "tag_name=v$tag" >> $env:GITHUB_OUTPUT

      - name: Bundle .msixbundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          # /bv 不能省:makeappx 自己的說明寫著「沒指定或設成 0.0.0.0 時,bundle 版本
          # 會用打包當下的日期時間」(<年>.<月日>.<時分>.<秒毫秒>),於是同一個 tag
          # 每次重跑都產出不同版本,而且跟 .msix 裡的版本對不上。
          & $makeappx bundle /o /bv ${{ steps.ver.outputs.appx_version }} `
            /d artifacts/msix /p "artifacts/Inkling_${{ steps.ver.outputs.tag_name }}.msixbundle"
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle 失敗($LASTEXITCODE)" }

      - name: Sign .msixbundle
        # 跟 build job 的 Sign 同一個條件:沒有憑證就整步跳過,產出未簽章的 bundle
        # (只能送 Store 代簽)。有憑證的話這一步是必要的 —— 簽章不會從裡面的 .msix
        # 傳遞到外層 bundle。
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = New-TemporaryFile
          try {
            [IO.File]::WriteAllBytes($pfx.FullName, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx.FullName /p $env:SIGNING_CERT_PASSWORD `
              "artifacts/Inkling_${{ steps.ver.outputs.tag_name }}.msixbundle"
            if ($LASTEXITCODE -ne 0) { throw "signtool sign 失敗($LASTEXITCODE)" }
          }
          finally {
            Remove-Item $pfx.FullName -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub Release
        # 試跑到這裡就停:前面已經把 stage → pack → bundle 整條路跑過一遍,那才是要驗的。
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh 解析 repo 的環境變數**只有 GH_REPO**,它不會回落到 Actions 內建的
          # GITHUB_REPOSITORY;而這個 job 沒有 checkout,gh 也就找不到 git remote 可問。
          # 少了這一行,前面全部成功之後最後一步會死在
          # 「failed to run git: fatal: not a git repository」——tag 已經推上去了,
          # 重跑還得先把 tag 刪掉。
          GH_REPO: ${{ github.repository }}
        run: |
          # 未簽章的 bundle 在這裡只是「Store 送審用 / 待簽章」的資產;
          # 要給使用者側載,必須先完成簽章(見 build job 的 Sign 步驟註解)。
          # PowerShell 不會對原生指令展開萬用字元,資產路徑要自己展開再傳。
          $assets = Get-ChildItem artifacts/msix/*.msix | ForEach-Object FullName
          $bundle = (Resolve-Path "artifacts/Inkling_${{ steps.ver.outputs.tag_name }}.msixbundle").Path
          gh release create '${{ steps.ver.outputs.tag_name }}' `
            --title '${{ steps.ver.outputs.tag_name }}' `
            --generate-notes `
            @assets $bundle
