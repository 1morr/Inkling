name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# 這條路只是建置與測試,一個字都不用寫回 repo。不宣告的話拿到的是 repo 預設值,
# 而 fork 的 pull_request 也會跑到這裡。
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 方案層級不能建:src/Inkling 是 MSIX 專案(Platforms 只有 x64;ARM64),
      # 方案檔沒有對應的組態對應,PublishSingleFile 與 MSIX 打包目標在方案層
      # 都會直接報錯(本機實測 NETSDK1097 / ProcessorArchitecture neutral)。
      # 所以分專案建 —— 這也正是 CLAUDE.md 記載的本機指令組合。
      # 注意:方案層級絕對不能加 -p:Platform=x64,Inkling.slnx 沒有那個組態。
      - name: Build extension (Debug, x64)
        run: dotnet build src/Inkling/Inkling.csproj -p:Platform=x64

      - name: Build tools
        run: |
          dotnet build tools/ApiDump/ApiDump.csproj
          dotnet build tools/VerifyRegistration/VerifyRegistration.csproj

      # dotnet test 只會建測試專案與它的依賴(Inkling.Core),不會碰到 MSIX 專案。
      - name: Test Core
        run: dotnet test

      # trimming 只在 publish 生效,兩個 RID 各建一次,確認 trimming 沒有把東西砍壞。
      # Release 的 IL2104 警告(Windows SDK 投影自身)是已知的,不視為失敗。
      - name: Publish Release win-x64 (trimmed)
        run: dotnet publish src/Inkling/Inkling.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      - name: Publish Release win-arm64 (trimmed)
        run: dotnet publish src/Inkling/Inkling.csproj -c Release -p:Platform=ARM64 -p:PublishProfile=win-arm64

      # 打包這一段以前只存在於 release.yml,而那條路只有推 tag 時才會跑 —— 也就是
      # manifest 與資產的驗證從來沒有在 PR 上把關過。實際代價付過:release job 少了
      # checkout、makeappx bundle 少了 /bv、bundle 沒簽章,三個問題全落在同一段
      # 沒跑過的程式碼裡。這裡只做到 pack(不簽章、不上傳),當成驗證用。
      #
      # makeappx 刻意不加 /nv:要的就是它完整的套件驗證 —— manifest 的 schema、
      # 資產檔在不在、圖示尺寸對不對,問題在這裡就擋下來。
      - name: Pack .msix (validation only)
        shell: pwsh
        run: |
          $tfm = 'net10.0-windows10.0.26100.0'
          ./tools/stage-layout.ps1 `
            -PublishDir "src/Inkling/bin/Release/$tfm/win-x64/publish" `
            -BuildLayoutDir "src/Inkling/bin/x64/Release/$tfm/win-x64" `
            -StageDir 'artifacts/stage-x64'

          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw '在 Windows Kits 底下找不到 makeappx.exe' }

          New-Item -ItemType Directory -Force -Path artifacts/out | Out-Null
          & $makeappx pack /o /d 'artifacts/stage-x64' /p 'artifacts/out/ci-validation.msix'
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack 失敗($LASTEXITCODE)" }

      # 宣告的語言必須是三種、而且第一項(預設)是 en-US。這一段的產生方式會**靜靜地**
      # 跟著建置機器的顯示語言跑(見 Inkling.csproj 的 DefaultLanguage 註解),
      # 錯了不會有任何步驟失敗,只會讓 Store 把三語擴展登記成單語。
      - name: Check declared package languages
        shell: pwsh
        run: |
          $tfm = 'net10.0-windows10.0.26100.0'
          [xml]$m = Get-Content "src/Inkling/bin/x64/Release/$tfm/win-x64/AppxManifest.xml"
          $langs = @($m.Package.Resources.Resource | ForEach-Object { $_.Language })
          $expected = @('EN-US', 'ZH-HANT', 'ZH-HANS')
          if (Compare-Object $langs $expected -SyncWindow 0) {
            throw "AppxManifest 宣告的語言是 [$($langs -join ', ')],預期 [$($expected -join ', ')]"
          }
          Write-Host "宣告的語言:$($langs -join ', ')" 
