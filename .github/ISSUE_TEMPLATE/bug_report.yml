name: Bug report
description: Inkling behaves differently from what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The version and log fields below cut the time to track
        something down a lot — Inkling has no console, so plenty of problems leave a
        trace only in the log.

        Write in English or Traditional Chinese, whichever you prefer.
        繁體中文也可以，不必翻成英文。

        Found something with security or data-loss impact? Please do not open a public
        issue — see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you actually saw, and what you expected instead.
      placeholder: I pressed Ctrl+D on the list page to delete a note, and after confirming…
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Summon Command Palette
        2. …
    validations:
      required: true

  - type: input
    id: cmdpal-version
    attributes:
      label: Command Palette version
      description: Output of `(Get-AppxPackage Microsoft.CommandPalette).Version` in PowerShell.
      placeholder: 0.11.11762.0
    validations:
      required: true

  - type: input
    id: inkling-version
    attributes:
      label: Inkling version
      description: Output of `(Get-AppxPackage *Inkling*).Version` in PowerShell.
      placeholder: 1.1.0.0
    validations:
      required: true

  - type: input
    id: notes-folder
    attributes:
      label: Notes folder
      description: The path set in Settings. Leave it blank if it has nothing to do with the problem.
      placeholder: C:\Users\me\Documents\Notes

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        ⚠️ **Read it through and redact before pasting.** This is a public page that
        search engines index, and Inkling's logs carry your **note titles**, **search
        strings**, and the **full path of your notes folder** (which usually contains
        your Windows username). Note bodies are never recorded — only their length —
        but a title alone is often enough to give something away, and a file path
        carries the title too. Replacing them with `note-1`, `aaa` and the like does
        not hurt the diagnosis.

        **Start here — nothing to set up.** Command Palette's own log is always on,
        and Inkling writes every failure to it, tagged `[Inkling]`:

        ```powershell
        $log = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\PowerToys\CmdPal\Logs" -Recurse -Filter 'Log_*.log' |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1
        Get-Content $log.FullName | Select-String '\[Inkling\]' -Context 0,6
        ```

        **If that turns up nothing**, switch on the detailed log: create an empty file
        `diagnostic.on` in `%LOCALAPPDATA%\Packages\<PFN>\LocalState\` (get
        `<PFN>` from `(Get-AppxPackage *Inkling*).PackageFamilyName`), run Reload in
        Command Palette, reproduce the problem, then paste `diagnostic.log` from that
        folder.
      render: text
