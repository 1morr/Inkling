name: Bug report
description: Inkling behaves differently from what you expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The version and log fields below cut the time to track
        something down a lot — Inkling has no console, so plenty of problems are only
        visible in `diagnostic.log`.

        Write in English or Traditional Chinese, whichever you prefer.
        繁體中文也可以,不必翻成英文。

        Found something with security or data-loss impact? Please do not open a public
        issue — see [SECURITY.md](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you actually saw, and what you expected instead.
      placeholder: I pressed Ctrl+D on the list page to delete a note, and after confirming…
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Summon Command Palette
        2. …
    validations:
      required: true

  - type: input
    id: cmdpal-version
    attributes:
      label: Command Palette version
      description: Output of `(Get-AppxPackage Microsoft.CommandPalette).Version` in PowerShell.
      placeholder: 0.11.11762.0
    validations:
      required: true

  - type: input
    id: inkling-version
    attributes:
      label: Inkling version
      description: Output of `(Get-AppxPackage Inkling).Version` in PowerShell.
      placeholder: 0.1.0.0
    validations:
      required: true

  - type: input
    id: notes-folder
    attributes:
      label: Notes folder
      description: The path set in Settings. Leave it blank if it has nothing to do with the problem.
      placeholder: C:\Users\me\Documents\Notes

  - type: textarea
    id: diagnostic-log
    attributes:
      label: diagnostic.log
      description: |
        ⚠️ **Read it through and redact before pasting.** This is a public page that
        search engines index, and the log records your **note titles**, **search
        strings**, and the **full path of your notes folder** (which usually contains
        your Windows username) verbatim. Note bodies are not recorded — only their
        length — but a title alone is often enough to give something away. Replacing
        them with `note-1`, `aaa` and the like does not hurt the diagnosis.

        To turn it on: create an empty file `diagnostic.on` in
        `%LOCALAPPDATA%\Packages\<PFN>\LocalState\` (get `<PFN>` from
        `(Get-AppxPackage Inkling).PackageFamilyName`), run Reload in Command Palette,
        reproduce the problem, then paste the contents of `diagnostic.log` from the
        same folder.
      render: text
