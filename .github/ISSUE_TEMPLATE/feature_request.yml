name: Feature request
description: Something you would like Inkling to be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Traditional Chinese, whichever you prefer.
        繁體中文也可以，不必翻成英文。

  - type: textarea
    id: scenario
    attributes:
      label: What problem are you trying to solve
      description: >-
        Describe the situation and what hurts about it before describing the feature —
        sometimes the same problem has a better answer.
      placeholder: I often want to jot down a sentence during a meeting, but…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: Walk through the flow you have in mind, starting from summoning Command Palette.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        One thing to know up front: Inkling is designed around "summon CmdPal → type →
        Enter". Anything that slows down the main search box is unlikely to be accepted.
