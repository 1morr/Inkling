<!--
  Inkling 的套件圖示 —— 小尺寸版,88px 以下
  (Square44x44Logo 的兩個尺寸、StoreLogo、LockScreenLogo)。

  跟 inkling-tile.svg 是同一個標記,差別只有「為了小尺寸而放大、加粗」:

  - 筆畫整體放大約 8%,起筆到收筆的寬度差拉開 —— 24px 底下細的那一端會先消失,
    不加粗的話收筆處會斷掉。
  - 句點從 r=18 放大到 r=25。原尺寸縮到 24px 只剩不到 2 個像素,幾乎看不見。
  - 兩者的間距跟著拉開,免得縮小後糊成一塊。

  不要把這一份跟精細版合併成同一個檔:向量圖等比縮小不等於小尺寸可讀,
  這是兩份原始檔存在的唯一理由。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="0" y="0" width="256" height="256" rx="57.6" ry="57.6" fill="#101F38"/>
  <path d="M104 30 C128 24 154 38 155 64 C156 94 148 128 141 156 C133 184 124 202 117 210
           C109 220 92 219 87 208 C82 197 89 185 95 167 C107 133 115 100 116 76
           C116 62 111 56 99 54 C86 52 90 33 104 30 Z" fill="#F6F9FD"/>
  <circle cx="182" cy="188" r="25" fill="#4CC2FF"/>
</svg>
