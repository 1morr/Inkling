<?xml version="1.0" encoding="UTF-8"?>
<!--
  寬幅版(Wide310x150 與啟動畫面)。底板不倒圓角 —— 開始畫面的寬磚由 Windows 自己遮罩。
  卡片沿用精細版的幾何,整組縮到 70% 之後置中,所以兩張圖並排時卡片的比例一模一樣。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4348C4"/>
      <stop offset="1" stop-color="#262A78"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="600" fill="url(#plate)"/>

  <!-- translate 是把縮小後的卡片挪回畫面中央,數字由 (1240-364)/2 與 (600-420)/2 反推 -->
  <g transform="translate(261.6,-58.4) scale(0.7)">
    <rect x="252" y="212" width="520" height="600" rx="64" fill="#F7F8FC"/>
    <rect x="316" y="456" width="292" height="44" rx="22" fill="#C3C8E4"/>
    <rect x="632" y="428" width="52" height="100" rx="26" fill="#FFB020"/>
    <rect x="316" y="552" width="196" height="44" rx="22" fill="#C3C8E4"/>
  </g>
</svg>
