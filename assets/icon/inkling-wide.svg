<!--
  Inkling 的套件圖示 —— 寬幅版(Wide310x150Logo 與 SplashScreen)。

  viewBox 是 620×300,也就是 Wide310x150Logo.scale-200 的實際像素;
  SplashScreen 用同一份原始檔渲染成 1240×600。

  構圖只有「滿版底色 + 置中的標記」,沒有字:
  這裡不能放文字 —— SVG 不嵌字型,而 Chromium headless 拿到什麼系統字型不保證,
  用 path 描字又會在改名時變成沒人敢動的死資料。啟動畫面本來也只需要一個標記。

  標記縮到 70%(256 × 0.7 = 179.2)再置中:
  x = (620 − 179.2) / 2 = 220.4,y = (300 − 179.2) / 2 = 60.4。
  改標記尺寸時這兩個數字要一起重算,不然圖會偏。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300">
  <rect x="0" y="0" width="620" height="300" fill="#101F38"/>
  <g transform="translate(220.4 60.4) scale(0.7)">
    <path d="M110 40 C128 36 146 46 147 66 C148 92 142 122 136 148 C130 174 122 190 116 198
             C110 206 99 205 95 197 C91 189 95 179 100 164 C110 134 117 104 118 80
             C118 66 114 60 106 58 C98 56 100 42 110 40 Z" fill="#F6F9FD"/>
    <circle cx="172" cy="186" r="18" fill="#4CC2FF"/>
  </g>
</svg>
