<!--
  Inkling 的 GitHub social preview(repo Settings → Social preview 上傳的那張圖)。

  viewBox 是 1280×640,GitHub 建議的尺寸(顯示時裁成 2:1;至少 640×320)。
  這張圖 GitHub 沒有 API 可以上傳,render-icons.ps1 產出 assets\social-preview.png 之後
  要自己到 repo Settings → General → Social preview 貼上去。

  構圖是「滿版底色 + 置中的標記」,沒有字:SVG 不嵌字型,Chromium headless 拿到什麼
  系統字型不保證,用 path 描字又會在改名時變成沒人敢動的死資料。
  repo 名字本來就會出現在卡片旁邊。

  **標記要放到很大,不要照 inkling-wide.svg 那樣縮小置中。** 那一份是 Windows 磚與
  啟動畫面,系統本來就把它畫得很小;這一份是別人在 Discord / X 上看到的獨立卡片,
  而且底色跟那些地方的深色主題幾乎一樣。原本是 scale(1.25),量出來的實際墨跡只有
  122×206 px —— 佔寬度 9.5%,遠看就是一塊空的深藍長方形,貼出去像根本沒有圖。

  **置中對的是墨跡,不是那個 256 的框。** 標記在自己的框裡本來就偏右下(墨跡是
  x 92.8–189.6、y 39.2–203.2,中心在 141.2, 121.2,不是 128, 128),照框置中看得出來偏。
  下面兩個數字是這樣算的,改 scale 就要一起重算:
    scale = 2.4  →  墨跡 232×394 px(佔高 61%,佔寬 18%)
    x = 640 − 141.2 × 2.4 = 301
    y = 320 − 121.2 × 2.4 = 29
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect x="0" y="0" width="1280" height="640" fill="#101F38"/>
  <g transform="translate(301 29) scale(2.4)">
    <path d="M110 40 C128 36 146 46 147 66 C148 92 142 122 136 148 C130 174 122 190 116 198
             C110 206 99 205 95 197 C91 189 95 179 100 164 C110 134 117 104 118 80
             C118 66 114 60 106 58 C98 56 100 42 110 40 Z" fill="#F6F9FD"/>
    <circle cx="172" cy="186" r="18" fill="#4CC2FF"/>
  </g>
</svg>
