<!--
  Inkling 的套件圖示 —— 精細版,150px 以上(Square150x150Logo、gallery 的 icon.png)。
  小尺寸另有 inkling-tile-small.svg,寬幅另有 inkling-wide.svg。

  主視覺是一道有壓感的下筆加一顆句點:起筆重、收筆輕,最後點一下收尾。
  取自 inkling 的字面 —— 一點墨水、一個還沒成形的念頭。

  三個刻意的取捨(都是實際渲染出來看過才定的):

  1. **筆畫是直立的,不是斜的。** 第一版起筆帶橫向,24px 縮下去讀成數字「7」。
  2. **句點分開放在右下,不放在筆畫正上方。** 放上方會讀成小寫字母 i。
  3. **滿版圓角磚,不是去背形狀。** Package.appxmanifest 的 BackgroundColor 是
     transparent,連「plated」那一版也不會有系統底板 —— 單色去背的形狀在深色主題
     會直接消失,所以磚本身必須是視覺。圓角半徑取 22.5%(256 × 0.225 = 57.6),
     和 Windows 11 的 squircle 目視接近。

  只用基本形狀與 path:不嵌字型、不嵌點陣圖 —— 這兩者在 Chromium headless 渲染
  (見 tools/render-icons.ps1)底下都不保證拿得到。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="0" y="0" width="256" height="256" rx="57.6" ry="57.6" fill="#101F38"/>
  <!-- 筆畫:上寬下窄的封閉外框,靠兩條曲線的間距做出壓感,不是描邊 -->
  <path d="M110 40 C128 36 146 46 147 66 C148 92 142 122 136 148 C130 174 122 190 116 198
           C110 206 99 205 95 197 C91 189 95 179 100 164 C110 134 117 104 118 80
           C118 66 114 60 106 58 C98 56 100 42 110 40 Z" fill="#F6F9FD"/>
  <!-- 句點:唯一的彩色元素,負責在深色磚上帶出一點層次 -->
  <circle cx="172" cy="186" r="18" fill="#4CC2FF"/>
</svg>
